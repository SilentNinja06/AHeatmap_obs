name: Release plugin

on:
  push:
    tags:
      - "*"
  # Manual fallback: creates the tag itself, from manifest.json's version.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="$(node -p "require('./manifest.json').version")"
            target_args=(--target "$GITHUB_SHA")
          else
            tag="${GITHUB_REF#refs/tags/}"
            target_args=()
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading assets only."
            gh release upload "$tag" --clobber main.js manifest.json styles.css
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              "${target_args[@]}" \
              main.js manifest.json styles.css
          fi
